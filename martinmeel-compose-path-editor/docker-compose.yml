services:
  server:
    image: python:3.12-alpine
    container_name: martinmeel-compose-path-editor_server_1
    restart: unless-stopped
    privileged: true
    pid: host
    network_mode: host
    environment:
      APP_ID: martinmeel-compose-path-editor
      HOST_UMBREL_ROOT: /host/umbrel
      PORT: '8099'
    volumes:
    - ${UMBREL_ROOT}:/host/umbrel
    - /:/hostfs
    command:
    - /bin/sh
    - -c
    - "cat > /tmp/server_runtime.py <<'PY'\nimport json, os, re, shutil, time, subprocess,\
      \ uuid\nfrom pathlib import Path\nfrom http.server import BaseHTTPRequestHandler,\
      \ ThreadingHTTPServer\nfrom urllib.parse import urlparse, parse_qs\n\nROOT =\
      \ Path(os.environ.get('HOST_UMBREL_ROOT', '/host/umbrel')).resolve()\nAPP_DATA\
      \ = (ROOT / 'app-data').resolve()\nSELF_APP_ID = os.environ.get('APP_ID', 'martinmeel-compose-path-editor')\n\
      PORT = int(os.environ.get('PORT', '8099'))\nUMBREL_VAR = chr(36) + '{UMBREL_ROOT}'\n\
      APP_DATA_VAR = chr(36) + '{APP_DATA_DIR}'\n\nALLOWED_PATHS = [\n    UMBREL_VAR\
      \ + '/home/Downloads/complete:/complete',\n    UMBREL_VAR + '/home/Downloads/incomplete:/incomplete',\n\
      \    UMBREL_VAR + '/home/Downloads/Films:/movies',\n    UMBREL_VAR + '/home/Downloads/Films2:/movies2',\n\
      \    UMBREL_VAR + '/home/Downloads/TVSeries:/tv',\n    UMBREL_VAR + '/home/Downloads/TVSeriesOLD:/tvold',\n\
      ]\n\nSRC_RE = re.compile(\n    r'(?P<prefix>^\\s*-\\s*)'\n    r'(?P<src>(?:'\
      \ + re.escape(UMBREL_VAR) + r'|/home/umbrel/umbrel)/home/Downloads(?:/[^:\\\
      s\"\\']+)?|'\n    + re.escape(APP_DATA_VAR) + r'/[^:\\s\"\\']+)'\n    r'(?P<rest>:.+)$$'\n\
      )\nLOGS = {}\n\n\ndef addlog(op, msg):\n    line = '[{}] [{}] {}'.format(time.strftime('%Y-%m-%d\
      \ %H:%M:%S'), op, msg)\n    LOGS.setdefault(op, []).append(line)\n    try:\n\
      \        with open('/tmp/compose-path-editor-debug.log', 'a', encoding='utf-8')\
      \ as f:\n            f.write(line + '\\n')\n    except Exception:\n        pass\n\
      \    print(line, flush=True)\n\n\ndef host_display(p):\n    return str(p).replace(str(ROOT),\
      \ UMBREL_VAR)\n\n\ndef safe_compose(app_id):\n    if not re.fullmatch(r'[a-zA-Z0-9][a-zA-Z0-9_.-]*',\
      \ app_id or ''):\n        raise ValueError('Invalid app id')\n    p = (APP_DATA\
      \ / app_id / 'docker-compose.yml').resolve()\n    if APP_DATA not in p.parents\
      \ or p.name != 'docker-compose.yml':\n        raise ValueError('Path outside\
      \ app-data')\n    if not p.exists():\n        raise FileNotFoundError('docker-compose.yml\
      \ not found')\n    return p\n\n\ndef list_apps():\n    out = []\n    if APP_DATA.exists():\n\
      \        for p in sorted(APP_DATA.glob('*/docker-compose.yml')):\n         \
      \   if p.parent.name == SELF_APP_ID:\n                continue\n           \
      \ out.append({'id': p.parent.name, 'path': host_display(p)})\n    return out\n\
      \n\ndef volume_lines(app_id):\n    p = safe_compose(app_id)\n    lines = p.read_text(encoding='utf-8',\
      \ errors='replace').splitlines()\n    out = []\n    for i, line in enumerate(lines):\n\
      \        m = SRC_RE.search(line)\n        if m:\n            out.append({'no':\
      \ i, 'text': line, 'source': m.group('src'), 'rest': m.group('rest')})\n   \
      \ return out\n\n\ndef backup_file(p, suffix='bak'):\n    b = p.with_name('docker-compose.yml.{}-{}'.format(suffix,\
      \ time.strftime('%Y%m%d-%H%M%S')))\n    shutil.copy2(p, b)\n    return b\n\n\
      \ndef modify_file(app_id, line_no, paths, action, op):\n    p = safe_compose(app_id)\n\
      \    if action not in ('replace', 'add', 'both'):\n        raise ValueError('Invalid\
      \ action')\n    if not paths or any(x not in ALLOWED_PATHS for x in paths):\n\
      \        raise ValueError('One or more selected volume mappings are not allowed')\n\
      \    lines = p.read_text(encoding='utf-8', errors='replace').splitlines(keepends=True)\n\
      \    if line_no < 0 or line_no >= len(lines):\n        raise ValueError('Invalid\
      \ line number')\n    old = lines[line_no]\n    m = SRC_RE.search(old.rstrip('\\\
      n'))\n    if not m:\n        raise ValueError('Selected line is not a recognized\
      \ volume source line')\n    indent = m.group('prefix')\n    if action == 'replace':\n\
      \        if len(paths) != 1:\n            raise ValueError('Replace only requires\
      \ exactly one selected volume mapping')\n        lines[line_no] = indent + paths[0]\
      \ + ('\\n' if old.endswith('\\n') else '')\n    elif action == 'add':\n    \
      \    lines[line_no + 1:line_no + 1] = [indent + mapping + '\\n' for mapping\
      \ in paths]\n    else:\n        lines[line_no] = indent + paths[0] + ('\\n'\
      \ if old.endswith('\\n') else '')\n        lines[line_no + 1:line_no + 1] =\
      \ [indent + mapping + '\\n' for mapping in paths[1:]]\n    b = backup_file(p)\n\
      \    tmp = p.with_suffix('.yml.tmp')\n    tmp.write_text(''.join(lines), encoding='utf-8')\n\
      \    tmp.replace(p)\n    text = p.read_text(encoding='utf-8', errors='replace')\n\
      \    expected = []\n    if action in ('replace', 'both'):\n        expected.append(paths[0])\n\
      \    if action == 'add':\n        expected += paths\n    if action == 'both':\n\
      \        expected += paths[1:]\n    missing = [x for x in expected if x not\
      \ in text]\n    if missing:\n        raise RuntimeError('Verification failed.\
      \ Missing after write: ' + ', '.join(missing))\n    addlog(op, 'File write verified.\
      \ Backup created: ' + host_display(b))\n    return host_display(b)\n\n\ndef\
      \ list_backups(app_id):\n    p = safe_compose(app_id)\n    arr = []\n    for\
      \ b in sorted(p.parent.glob('docker-compose.yml.bak-*'), reverse=True):\n  \
      \      arr.append({'name': b.name, 'path': host_display(b)})\n    return arr\n\
      \n\ndef restore_backup(app_id, backup_name, op):\n    p = safe_compose(app_id)\n\
      \    if '/' in backup_name or not backup_name.startswith('docker-compose.yml.bak-'):\n\
      \        raise ValueError('Invalid backup name')\n    b = (p.parent / backup_name).resolve()\n\
      \    if p.parent not in b.parents or not b.exists():\n        raise FileNotFoundError('Backup\
      \ not found')\n    safety = backup_file(p, 'before-restore')\n    shutil.copy2(b,\
      \ p)\n    if p.read_bytes() != b.read_bytes():\n        raise RuntimeError('Restore\
      \ verification failed')\n    addlog(op, 'Restore verified. Safety backup created:\
      \ ' + host_display(safety))\n    return host_display(safety)\n\n\ndef run_cmd(args,\
      \ op, timeout=60):\n    addlog(op, 'Trying command: ' + ' '.join(args))\n  \
      \  try:\n        cp = subprocess.run(args, capture_output=True, text=True, timeout=timeout)\n\
      \        addlog(op, 'Exit code {}. stdout={} stderr={}'.format(cp.returncode,\
      \ cp.stdout.strip(), cp.stderr.strip()))\n        return cp.returncode, cp.stdout.strip(),\
      \ cp.stderr.strip()\n    except subprocess.TimeoutExpired as e:\n        out\
      \ = e.stdout or ''\n        err = e.stderr or ''\n        addlog(op, 'TIMEOUT\
      \ after {}s. stdout={} stderr={}'.format(timeout, str(out).strip(), str(err).strip()))\n\
      \        return 124, out, err or 'timeout'\n\n\ndef control_app(app_id, verb,\
      \ op):\n    if verb not in ('stop', 'restart'):\n        raise ValueError('Invalid\
      \ app control verb')\n    mutation = 'apps.{}.mutate'.format(verb)\n    addlog(op,\
      \ 'Preparing app control action: {} for {}'.format(verb, app_id))\n    script\
      \ = (\n        'cd /home/umbrel 2>/dev/null || cd /; '\n        'export PATH=\"\
      /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/umbreld/bin:/opt/umbreld\"\
      ; '\n        'export HOME=/home/umbrel USER=umbrel LOGNAME=umbrel TMPDIR=/tmp;\
      \ '\n        '/opt/umbreld/umbreld client {} --appId {}'.format(mutation, app_id)\n\
      \    )\n    attempts = [\n        ['/usr/sbin/chroot', '/hostfs', '/bin/su',\
      \ '-', 'umbrel', '-c', script],\n        ['chroot', '/hostfs', '/bin/su', '-',\
      \ 'umbrel', '-c', script],\n        ['/usr/sbin/chroot', '/hostfs', '/bin/sh',\
      \ '-lc', script],\n        ['chroot', '/hostfs', '/bin/sh', '-lc', script],\n\
      \    ]\n    errors = []\n    for a in attempts:\n        code, out, err = run_cmd(a,\
      \ op, timeout=60)\n        if code == 0 and (out.strip() == 'true' or out.strip().endswith('true')\
      \ or not err):\n            addlog(op, 'App control {} succeeded for {}'.format(verb,\
      \ app_id))\n            return\n        errors.append('{} => code {}; stdout={};\
      \ stderr={}'.format(' '.join(a), code, out, err))\n    raise RuntimeError('Could\
      \ not run umbreld client ' + mutation + ' for ' + app_id + '. Attempts:\\n'\
      \ + '\\n'.join(errors))\n\n\ndef html():\n    allowed_json = json.dumps(ALLOWED_PATHS)\n\
      \    return '''<!doctype html><html><head><meta charset=\"utf-8\"><meta name=\"\
      viewport\" content=\"width=device-width,initial-scale=1\"><title>Compose Path\
      \ Editor</title><style>body{font-family:system-ui;margin:0;background:#111827;color:#e5e7eb}main{max-width:1100px;margin:auto;padding:24px}.card{background:#1f2937;border:1px\
      \ solid #374151;border-radius:18px;padding:22px;margin:18px 0}select,button{width:100%;font:inherit;border-radius:12px;border:1px\
      \ solid #4b5563;background:#111827;color:#fff;padding:12px}button{background:#2563eb;border:0;font-weight:700;margin-top:14px}.box{display:block;padding:12px;border:1px\
      \ solid #4b5563;border-radius:12px;background:#111827;margin:8px 0}.muted{color:#a8b0bf}pre{white-space:pre-wrap;background:#0b1220;padding:14px;border-radius:12px;overflow:auto}.ok{color:#86efac}.err{color:#fca5a5}</style></head><body><main><h1>Compose\
      \ Path Editor</h1><p class=\"muted\">Select an installed Umbrel app, choose\
      \ a volume line, then replace, add, or restore backups. The target app is stopped\
      \ first and restarted after verified changes.</p><div class=\"card\"><h2>1.\
      \ Select docker-compose.yml</h2><select id=\"apps\"></select></div><div class=\"\
      card\"><h2>2. Select volume line from docker-compose.yml</h2><select id=\"lines\"\
      ></select><pre id=\"preview\">Loading...</pre></div><div class=\"card\"><h2>3.\
      \ Choose action and volume mapping(s)</h2><label class=\"box\"><input type=\"\
      radio\" name=\"action\" value=\"replace\" checked> <b>Replace only</b><br><span\
      \ class=\"muted\">Replace the selected source. Select exactly one volume mapping.</span></label><label\
      \ class=\"box\"><input type=\"radio\" name=\"action\" value=\"add\"> <b>Add\
      \ only</b><br><span class=\"muted\">Keep the selected line and add one or more\
      \ new volume lines after it.</span></label><label class=\"box\"><input type=\"\
      radio\" name=\"action\" value=\"both\"> <b>Replace and add</b><br><span class=\"\
      muted\">Replace with first selected mapping and add remaining selected mappings.</span></label><div\
      \ id=\"paths\"></div><button id=\"apply\">Apply selected action</button><p id=\"\
      status\" class=\"muted\"></p></div><div class=\"card\"><h2>4. Restore a backup</h2><select\
      \ id=\"backups\"></select><button id=\"restore\">Restore selected backup</button><p\
      \ id=\"restoreStatus\" class=\"muted\"></p></div><div class=\"card\"><h2>Live\
      \ debug log</h2><pre id=\"log\">No operation yet.</pre></div></main><script>\\\
      n''' + \"const allowed=\" + allowed_json + \";\\n\" + r'''\nfunction ge(id){return\
      \ document.getElementById(id)}\nlet current=[];\nfunction esc(s){return String(s).replace(/[&<>]/g,function(c){return\
      \ {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}\nfunction selectedPaths(){return\
      \ Array.prototype.slice.call(document.querySelectorAll('#paths input:checked')).map(function(x){return\
      \ x.value})}\nfunction action(){return document.querySelector('input[name=\"\
      action\"]:checked').value}\nfunction renderPaths(){\n  ge('paths').innerHTML=allowed.map(function(p,i){return\
      \ '<label class=\"box\"><input type=\"checkbox\" value=\"'+esc(p)+'\" '+(i===0?'checked':'')+'>\
      \ '+esc(p)+'</label>'}).join('');\n  Array.prototype.slice.call(document.querySelectorAll('input')).forEach(function(x){x.onchange=preview})\n\
      }\nasync function loadApps(){let d=await (await fetch('/api/apps')).json();\
      \ ge('apps').innerHTML=d.apps.map(function(a){return '<option value=\"'+esc(a.id)+'\"\
      >'+esc(a.id)+' - '+esc(a.path)+'</option>'}).join(''); await loadLines(); await\
      \ loadBackups()}\nasync function loadLines(){let id=ge('apps').value; let d=await\
      \ (await fetch('/api/file?app_id='+encodeURIComponent(id))).json(); current=d.lines||[];\
      \ ge('lines').innerHTML=current.length?current.map(function(l){return '<option\
      \ value=\"'+l.no+'\">'+(l.no+1)+': '+esc(l.text)+'</option>'}).join(''):'<option>No\
      \ replaceable volume lines found</option>'; preview()}\nasync function loadBackups(){let\
      \ id=ge('apps').value; let d=await (await fetch('/api/backups?app_id='+encodeURIComponent(id))).json();\
      \ ge('backups').innerHTML=(d.backups||[]).length?d.backups.map(function(b){return\
      \ '<option value=\"'+esc(b.name)+'\">'+esc(b.name)+'</option>'}).join(''):'<option\
      \ value=\"\">No backups found</option>'}\nfunction preview(){let item=current.find(function(x){return\
      \ x.no==Number(ge('lines').value)}); let ps=selectedPaths(); ge('preview').textContent=item?('Selected\
      \ line:\\n'+item.text+'\\n\\nAction: '+action()+'\\nSelected volume mapping(s):\\\
      n'+ps.join('\\n')):'No line selected'}\nasync function poll(op){ if(!op) return;\
      \ let d=await (await fetch('/api/logs?op='+encodeURIComponent(op))).json();\
      \ ge('log').textContent=(d.logs||[]).join('\\n')||'No logs yet.'; ge('log').scrollTop=ge('log').scrollHeight\
      \ }\nasync function post(url, body, statusEl){let op=Date.now()+'-'+Math.random().toString(16).slice(2);\
      \ body.op=op; let timer=setInterval(function(){poll(op)},1000); statusEl.textContent='Stopping\
      \ target app, applying changes, verifying, then restarting target app...'; try{let\
      \ ctrl=new AbortController(); let to=setTimeout(function(){ctrl.abort()},120000);\
      \ let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:ctrl.signal});\
      \ clearTimeout(to); let d=await r.json(); await poll(op); if(r.ok){statusEl.innerHTML='<span\
      \ class=\"ok\">Changes verified and saved. Target app restarted.</span>'; ge('preview').textContent=d.message+'\\\
      n\\nBackup: '+(d.backup||d.safety_backup||''); await loadLines(); await loadBackups()}\
      \ else {statusEl.innerHTML='<span class=\"err\">Error:</span> '+esc(d.error||'Unknown')}}catch(e){statusEl.innerHTML='<span\
      \ class=\"err\">Error:</span> request timed out or was interrupted. See live\
      \ log.'} finally{clearInterval(timer); await poll(op)}}\nge('apps').onchange=async\
      \ function(){await loadLines(); await loadBackups()}; ge('lines').onchange=preview;\
      \ ge('apply').onclick=function(){post('/api/modify',{app_id:ge('apps').value,line_no:Number(ge('lines').value),paths:selectedPaths(),action:action()},ge('status'))};\
      \ ge('restore').onclick=function(){post('/api/restore',{app_id:ge('apps').value,backup_name:ge('backups').value},ge('restoreStatus'))};\
      \ renderPaths(); loadApps().catch(function(e){ge('status').textContent=e});\n\
      </script></body></html>'''\n\n\nclass H(BaseHTTPRequestHandler):\n    def j(self,\
      \ obj, code=200):\n        data = json.dumps(obj).encode()\n        self.send_response(code)\n\
      \        self.send_header('Content-Type', 'application/json')\n        self.send_header('Content-Length',\
      \ str(len(data)))\n        self.end_headers()\n        self.wfile.write(data)\n\
      \n    def do_GET(self):\n        u = urlparse(self.path)\n        try:\n   \
      \         if u.path == '/':\n                data = html().encode()\n      \
      \          self.send_response(200)\n                self.send_header('Content-Type',\
      \ 'text/html; charset=utf-8')\n                self.send_header('Content-Length',\
      \ str(len(data)))\n                self.end_headers()\n                self.wfile.write(data)\n\
      \            elif u.path == '/api/apps':\n                self.j({'apps': list_apps()})\n\
      \            elif u.path == '/api/file':\n                self.j({'lines': volume_lines(parse_qs(u.query).get('app_id',\
      \ [''])[0])})\n            elif u.path == '/api/backups':\n                self.j({'backups':\
      \ list_backups(parse_qs(u.query).get('app_id', [''])[0])})\n            elif\
      \ u.path == '/api/logs':\n                self.j({'logs': LOGS.get(parse_qs(u.query).get('op',\
      \ [''])[0], [])})\n            else:\n                self.j({'error': 'Not\
      \ found'}, 404)\n        except Exception as e:\n            self.j({'error':\
      \ str(e)}, 400)\n\n    def do_POST(self):\n        op = str(uuid.uuid4())\n\
      \        try:\n            body = json.loads(self.rfile.read(int(self.headers.get('Content-Length',\
      \ '0'))) or b'{}')\n            op = body.get('op') or op\n            LOGS[op]\
      \ = []\n            if urlparse(self.path).path == '/api/modify':\n        \
      \        app = body.get('app_id')\n                addlog(op, 'Starting modify\
      \ operation for ' + app)\n                control_app(app, 'stop', op)\n   \
      \             backup = modify_file(app, int(body.get('line_no')), body.get('paths')\
      \ or [], body.get('action'), op)\n                control_app(app, 'restart',\
      \ op)\n                self.j({'message': 'Changes verified and saved. Target\
      \ app stopped before the change and restarted after verification.', 'backup':\
      \ backup, 'logs': LOGS[op]})\n            elif urlparse(self.path).path == '/api/restore':\n\
      \                app = body.get('app_id')\n                addlog(op, 'Starting\
      \ restore operation for ' + app)\n                control_app(app, 'stop', op)\n\
      \                safety = restore_backup(app, body.get('backup_name'), op)\n\
      \                control_app(app, 'restart', op)\n                self.j({'message':\
      \ 'Backup restored and verified. Target app restarted.', 'safety_backup': safety,\
      \ 'logs': LOGS[op]})\n            else:\n                self.j({'error': 'Not\
      \ found'}, 404)\n        except Exception as e:\n            addlog(op, 'ERROR:\
      \ ' + str(e))\n            self.j({'error': str(e), 'logs': LOGS.get(op, [])},\
      \ 400)\n\n    def log_message(self, fmt, *args):\n        print(fmt % args,\
      \ flush=True)\n\n\nThreadingHTTPServer(('0.0.0.0', PORT), H).serve_forever()\n\
      \nPY\npython /tmp/server_runtime.py"
