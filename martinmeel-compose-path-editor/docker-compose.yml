services:
  app_proxy:
    environment:
      APP_HOST: martinmeel-compose-path-editor_server_1
      APP_PORT: 8099

  server:
    image: python:3.12-alpine
    restart: on-failure
    environment:
      HOST_UMBREL_ROOT: /host/umbrel
      APP_ID: martinmeel-compose-path-editor
    volumes:
      - /home/umbrel/umbrel:/host/umbrel
    command:
      - sh
      - -c
      - |-
        cat > /tmp/server.py <<'PY'
        import json, os, re, shutil, time
        from pathlib import Path
        from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
        from urllib.parse import urlparse, parse_qs

        ROOT = Path(os.environ.get('HOST_UMBREL_ROOT', '/host/umbrel')).resolve()
        APP_DATA = (ROOT / 'app-data').resolve()
        SELF_APP_ID = os.environ.get('APP_ID', 'martinmeel-compose-path-editor')
        ALLOWED_PATHS = [
          '/home/umbrel/umbrel/home/Downloads/qbittorrent/complete',
          '/home/umbrel/umbrel/home/Downloads/qbittorrent/incomplete',
          '/home/umbrel/umbrel/home/Downloads/sabnzbd/complete',
          '/home/umbrel/umbrel/home/Downloads/Films',
          '/home/umbrel/umbrel/home/Downloads/Films2',
          '/home/umbrel/umbrel/home/Downloads/TVSerie',
          '/home/umbrel/umbrel/home/Downloads/TVSeriesOLD',
        ]
        SOURCE_RE = re.compile(r"(?P<source>(?:/home/umbrel/umbrel|\$[{]UMBREL_ROOT[}])/home/Downloads[^:\s\"']*|\$[{]APP_DATA_DIR[}][^:\s\"']*)(?=:[^:]+)")

        def preferred_compose_path(old_source, absolute_new_path):
          prefix = '/home/umbrel/umbrel'
          if old_source.startswith('$${UMBREL_ROOT}') and absolute_new_path.startswith(prefix):
              return '$${UMBREL_ROOT}' + absolute_new_path[len(prefix):]
          return absolute_new_path

        def html():
          paths = json.dumps(ALLOWED_PATHS)
          return """<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compose Path Editor</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#111827;color:#e5e7eb}main{max-width:980px;margin:0 auto;padding:32px 18px}.card{background:#1f2937;border:1px solid #374151;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 10px 30px #0004}h1{margin:0 0 8px;font-size:32px}h2{font-size:18px;margin:0 0 14px}.muted{color:#9ca3af}select,button{width:100%;font:inherit;border-radius:12px;border:1px solid #4b5563;background:#111827;color:#f9fafb;padding:12px}button{background:#2563eb;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.45}.paths{display:grid;gap:8px}.path{display:block;padding:11px 12px;border:1px solid #4b5563;border-radius:12px;background:#111827;cursor:pointer}.path input{margin-right:10px}pre{white-space:pre-wrap;background:#0b1220;border-radius:12px;padding:14px;overflow:auto}.ok{color:#86efac}.err{color:#fca5a5}code{color:#bfdbfe}</style></head><body><main><h1>Compose Path Editor</h1><p class="muted">Select an installed Umbrel app, choose one volume source line from its docker-compose.yml, then select the new download path to replace it with. Lines such as <code>$${UMBREL_ROOT}/home/Downloads/TVSeries:/tv</code>, <code>$${UMBREL_ROOT}/home/Downloads/complete:/downloads</code>, and <code>$${APP_DATA_DIR}/data/config:/config</code> are shown. The container side after the colon is preserved.</p><div class="card"><h2>1. Select docker-compose.yml</h2><select id="apps"><option>Loading...</option></select></div><div class="card"><h2>2. Select volume line from docker-compose.yml</h2><select id="lines"><option>Choose an app first</option></select><pre id="preview" class="muted">No line selected.</pre></div><div class="card"><h2>3. Select new path</h2><select id="newPath"><option>Loading...</option></select></div><div class="card"><button id="save" disabled>Create backup and update docker-compose.yml</button><p id="status" class="muted"></p></div></main><script>const allowed = """ + paths + r""";const apps=document.getElementById('apps'),newPath=document.getElementById('newPath'),lines=document.getElementById('lines'),preview=document.getElementById('preview'),save=document.getElementById('save'),status=document.getElementById('status');let selectedPath=allowed[0],current=[];function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}function renderPaths(){newPath.innerHTML=allowed.map((p,i)=>`<option value="$${esc(p)}" $${i==0?'selected':''}>$${esc(p)}</option>`).join('');selectedPath=newPath.value||allowed[0];newPath.onchange=()=>{selectedPath=newPath.value;renderPreview();};}async function loadApps(){const r=await fetch('/api/apps');const data=await r.json();apps.innerHTML=data.apps.length?data.apps.map(a=>`<option value="$${esc(a.id)}">$${esc(a.id)} - $${esc(a.path)}</option>`).join(''):'<option value="">No apps found</option>';await loadLines();}async function loadLines(){status.textContent='';save.disabled=true;preview.textContent='Loading...';const id=apps.value;if(!id){preview.textContent='No app selected.';return;}const r=await fetch('/api/file?app_id='+encodeURIComponent(id));const data=await r.json();current=data.lines||[];lines.innerHTML=current.length?current.map(l=>`<option value="$${l.no}">$${l.no+1}: $${esc(l.text).slice(0,180)}</option>`).join(''):'<option>No replaceable volume lines found</option>';renderPreview();}function renderPreview(){const no=Number(lines.value);const item=current.find(x=>x.no===no);if(!item){preview.textContent='No line selected.';save.disabled=true;return;}preview.textContent='Old line:\n'+item.text+'\n\nNew source:\n'+selectedPath+'\n\nThe container side after the colon will be preserved.';save.disabled=false;}apps.onchange=loadLines;lines.onchange=renderPreview;save.onclick=async()=>{status.textContent='Saving...';save.disabled=true;const r=await fetch('/api/apply',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app_id:apps.value,line_no:Number(lines.value),new_path:selectedPath})});const data=await r.json();if(r.ok){status.innerHTML='<span class="ok">Saved.</span> Backup: '+esc(data.backup);preview.textContent='Old line:\n'+data.old+'\n\nNew line:\n'+data.new;await loadLines();}else{status.innerHTML='<span class="err">Error:</span> '+esc(data.error||'Unknown');save.disabled=false;}};renderPaths();loadApps().catch(e=>{status.innerHTML='<span class="err">'+esc(String(e))+'</span>';});</script></body></html>"""

        def safe_compose(app_id):
          if not re.fullmatch(r'[a-zA-Z0-9][a-zA-Z0-9_.-]*', app_id or ''):
              raise ValueError('Invalid app ID')
          path = (APP_DATA / app_id / 'docker-compose.yml').resolve()
          if APP_DATA not in path.parents or path.name != 'docker-compose.yml':
              raise ValueError('Path is outside app-data')
          if not path.exists():
              raise FileNotFoundError('docker-compose.yml not found')
          return path

        def list_apps():
          if not APP_DATA.exists(): return []
          out=[]
          for p in sorted(APP_DATA.glob('*/docker-compose.yml')):
              app_id=p.parent.name
              if app_id == SELF_APP_ID: continue
              out.append({'id': app_id, 'path': str(p).replace(str(ROOT), '/home/umbrel/umbrel')})
          return out

        def compose_lines(app_id):
          p=safe_compose(app_id)
          lines=p.read_text(encoding='utf-8', errors='replace').splitlines()
          return [{'no': i, 'text': line} for i,line in enumerate(lines) if SOURCE_RE.search(line)]

        def apply(app_id, line_no, new_path):
          if new_path not in ALLOWED_PATHS: raise ValueError('New path is not in the whitelist')
          p=safe_compose(app_id)
          lines=p.read_text(encoding='utf-8', errors='replace').splitlines(keepends=True)
          if not isinstance(line_no, int) or line_no < 0 or line_no >= len(lines): raise ValueError('Invalid line number')
          old=lines[line_no]
          match=SOURCE_RE.search(old)
          if not match: raise ValueError('Selected line does not contain a replaceable volume source')
          replacement = preferred_compose_path(match.group('source'), new_path)
          new = old[:match.start('source')] + replacement + old[match.end('source'):]
          if new == old: raise ValueError('Nothing changed')
          backup=p.with_name('docker-compose.yml.bak-' + time.strftime('%Y%m%d-%H%M%S'))
          shutil.copy2(p, backup)
          lines[line_no]=new
          tmp=p.with_suffix('.yml.tmp')
          tmp.write_text(''.join(lines), encoding='utf-8')
          tmp.replace(p)
          return str(backup).replace(str(ROOT), '/home/umbrel/umbrel'), old.rstrip('\n'), new.rstrip('\n')

        class Handler(BaseHTTPRequestHandler):
          def send_json(self, obj, code=200):
              data=json.dumps(obj).encode(); self.send_response(code); self.send_header('Content-Type','application/json'); self.send_header('Content-Length',str(len(data))); self.end_headers(); self.wfile.write(data)
          def do_GET(self):
              u=urlparse(self.path)
              try:
                  if u.path == '/':
                      data=html().encode(); self.send_response(200); self.send_header('Content-Type','text/html; charset=utf-8'); self.send_header('Content-Length',str(len(data))); self.end_headers(); self.wfile.write(data)
                  elif u.path == '/api/apps': self.send_json({'apps': list_apps()})
                  elif u.path == '/api/file': self.send_json({'lines': compose_lines(parse_qs(u.query).get('app_id',[''])[0])})
                  else: self.send_json({'error':'Not found'},404)
              except Exception as e: self.send_json({'error':str(e)},400)
          def do_POST(self):
              try:
                  if urlparse(self.path).path != '/api/apply': return self.send_json({'error':'Not found'},404)
                  length=int(self.headers.get('Content-Length','0'))
                  body=json.loads(self.rfile.read(length) or b'{}')
                  backup, old, new = apply(body.get('app_id'), body.get('line_no'), body.get('new_path'))
                  self.send_json({'backup': backup, 'old': old, 'new': new})
              except Exception as e: self.send_json({'error':str(e)},400)
          def log_message(self, fmt, *args): print('%s - %s' % (self.address_string(), fmt%args), flush=True)

        ThreadingHTTPServer(('0.0.0.0', 8099), Handler).serve_forever()
        PY
        python /tmp/server.py
