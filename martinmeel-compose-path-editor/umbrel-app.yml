manifestVersion: 1.1
id: martinmeel-compose-path-editor
category: developer
name: Compose Path Editor
version: "0.2.0"
tagline: Edit Umbrel docker-compose.yml volume paths
icon: https://raw.githubusercontent.com/MartinMeel/umbrel-app-gallery/main/martinmeel-compose-path-editor/icon.svg
releaseNotes: >-
  Update: add a restore backup option. Backups are listed per selected app, and
  restores are verified by reading docker-compose.yml back after writing.
description: >-
  Compose Path Editor is a local Umbrel utility that lets you select an
  installed app docker-compose.yml file, choose allowed download paths,
  explicitly choose whether to replace an existing volume source, add one or
  more new volume lines, or do both. A backup file is created before every
  change, and created backups can be restored from the UI with verification.
developer: martinmeel
