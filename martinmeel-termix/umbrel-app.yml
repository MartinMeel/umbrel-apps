manifestVersion: 1
id: martinmeel-termix
name: Termix
tagline: Web-based SSH terminal, tunneling, and file management
icon: https://raw.githubusercontent.com/Termix-SSH/Termix/main/public/favicon.ico
category: networking
version: "2.2.1"
port: 8034
description: >-
  Termix is a modern web-based server management platform that brings the power
  of SSH directly to your browser.
 
 
  Key features:
 
  - 🖥️ Web SSH Terminal — Connect to any server via SSH right from your browser,
    no client installation required.
 
  - 🔒 Secure Tunneling — Built-in support for SSH tunneling to safely expose
    and manage remote services.
 
  - 📁 File Editor — Browse, edit, and manage remote files through an intuitive
    in-browser interface.
 
  - 🔗 Multi-server Management — Organise and connect to multiple servers from a
    single dashboard.
 
  - ⚡ Powered by Apache Guacamole — Uses the battle-tested guacd daemon for
    robust, protocol-level SSH handling.
 
 
  All session data is stored locally on your Umbrel, keeping your credentials
  and connection configs private and under your control.
