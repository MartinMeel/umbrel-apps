services:
  app_proxy:
    environment:
      APP_HOST: martinmeel-termix_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/lukegus/termix:release-2.3.1.0@sha256:8db77c17ca27813916fa3321c7c2b274e1bbc40f017570b8934415ee578ac2f9
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - "${APP_DATA_DIR}/data:/app/data"
    environment:
      PORT: "8080"
      DATA_DIR: "/app/data"
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
    depends_on:
      - guacd

  guacd:
    image: guacamole/guacd:1.6.0
    restart: on-failure
    stop_grace_period: 1m
