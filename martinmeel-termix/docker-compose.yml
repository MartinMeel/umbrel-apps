services:
  termix:
    image: ghcr.io/lukegus/termix:latest
    container_name: termix_web
    restart: on-failure
    stop_grace_period: 1m
    ports:
      - "8034:8080"
    volumes:
      - "${APP_DATA_DIR}/data:/app/data"
    environment:
      PORT: "8080"
    depends_on:
      - guacd
    networks:
      default:
        ipv4_address: $APP_TERMIX_IP
 
  guacd:
    image: guacamole/guacd:1.6.0
    container_name: termix_guacd
    restart: on-failure
    stop_grace_period: 1m
    # guacd listens internally only — not exposed to host
    networks:
      default:
        ipv4_address: $APP_TERMIX_GUACD_IP
 
networks:
  default:
    name: $APP_NETWORK