services:
  app_proxy:
    environment:
      APP_HOST: martinmeel-termix_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/lukegus/termix:release-2.4.0@sha256:ef1209318a9e7e3a9a668ebb6ac9e670cbc567a9e86cc03cb3e06f9ea17eb732
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - "${APP_DATA_DIR}/data:/app/data"
    environment:
      PORT: "8080"
      DATA_DIR: "/app/data"
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
    depends_on:
      - guacd

  guacd:
    image: guacamole/guacd:1.6.0
    restart: on-failure
    stop_grace_period: 1m
