services:

  # ── App proxy — required by umbrelOS to route the web UI ────
  app_proxy:
    environment:
      APP_HOST: martinmeel-nasinit_init_1
      APP_PORT: 7891

  # ── Init + status service ────────────────────────────────────
  # privileged + pid:host allows nsenter to run commands on the
  # host system (install packages, mount CIFS shares, etc.)
  init:
    image: debian:bookworm-slim
    container_name: martinmeel-nasinit_init_1
    restart: on-failure
    privileged: true
    pid: host
    volumes:
      - /home/umbrel:/home/umbrel
    command: >
      bash -c "
        set -euo pipefail

        GREEN='\033[0;32m'
        YELLOW='\033[1;33m'
        RED='\033[0;31m'
        NC='\033[0m'
        info()  { echo -e \"$${GREEN}[INFO]$${NC}  $$*\"; }
        warn()  { echo -e \"$${YELLOW}[WARN]$${NC}  $$*\"; }
        error() { echo -e \"$${RED}[ERROR]$${NC} $$*\"; }

        STATUS_FILE=/home/umbrel/docker-init/status.json
        mkdir -p /home/umbrel/docker-init
        echo '{\"status\":\"starting\",\"timestamp\":\"'$$(date -Iseconds)'\"}' > $$STATUS_FILE

        HOST='nsenter --target 1 --mount --uts --ipc --net --pid --root --wd --'

        # ── Step 1: cifs-utils ───────────────────────────────
        info 'Step 1 — Checking cifs-utils on host ...'
        if ! $$HOST dpkg-query -W -f='$${Status}' cifs-utils 2>/dev/null | grep -q 'install ok installed'; then
          info '  Installing cifs-utils ...'
          $$HOST apt-get update -qq
          $$HOST apt-get install -y -qq cifs-utils
          info '  Done.'
        else
          info '  Already installed.'
        fi

        # ── Step 2: mc ───────────────────────────────────────
        info 'Step 2 — Checking mc on host ...'
        if ! $$HOST which mc > /dev/null 2>&1; then
          info '  Running apt-get update ...'
          $$HOST apt-get update -qq
          info '  Installing mc ...'
          $$HOST apt-get install -y -qq mc
          info '  Done.'
        else
          info '  Already installed.'
        fi

        # ── Step 3: Mount NAS shares ─────────────────────────
        info 'Step 3 — Mounting NAS shares on host ...'
        CREDENTIALS=/home/umbrel/.smbcredentials
        SOURCES=(
          '//192.168.2.168/Downloads/qbittorrent/complete'
          '//192.168.2.168/Downloads/qbittorrent/incomplete'
          '//192.168.2.168/Downloads/sabnzbd/complete'
          '//192.168.2.168/Downloads/sabnzbd/incomplete'
        )
        TARGETS=(
          '/home/umbrel/umbrel/home/Downloads/NAS/qbittorrent/complete'
          '/home/umbrel/umbrel/home/Downloads/NAS/qbittorrent/incomplete'
          '/home/umbrel/umbrel/home/Downloads/NAS/sabnzbd/complete'
          '/home/umbrel/umbrel/home/Downloads/NAS/sabnzbd/incomplete'
        )
        MOUNT_STATUS=()
        for i in \$${!SOURCES[@]}; do
          src=\"\$${SOURCES[$$i]}\"
          tgt=\"\$${TARGETS[$$i]}\"
          $$HOST mkdir -p \"$$tgt\"
          if $$HOST mount | grep -q \" on $$tgt \"; then
            warn \"  Already mounted: $$tgt\"
            MOUNT_STATUS+=(\"ok\")
          else
            info \"  Mounting $$src → $$tgt\"
            if $$HOST mount -t cifs \"$$src\" \"$$tgt\" -o \"credentials=$$CREDENTIALS,uid=1000,user\"; then
              info \"  Mounted successfully.\"
              MOUNT_STATUS+=(\"ok\")
            else
              error \"  Failed: $$src\"
              MOUNT_STATUS+=(\"error\")
            fi
          fi
        done

        # ── Step 4: Write status file ────────────────────────
        MC_STATUS=\"ok\"
        if ! $$HOST which mc > /dev/null 2>&1; then MC_STATUS=\"error\"; fi
        echo \"{
          \\\"status\\\": \\\"done\\\",
          \\\"timestamp\\\": \\\"$$(date -Iseconds)\\\",
          \\\"mc\\\": \\\"$$MC_STATUS\\\",
          \\\"mounts\\\": {
            \\\"qbittorrent_complete\\\": \\\"\$${MOUNT_STATUS[0]}\\\",
            \\\"qbittorrent_incomplete\\\": \\\"\$${MOUNT_STATUS[1]}\\\",
            \\\"sabnzbd_complete\\\": \\\"\$${MOUNT_STATUS[2]}\\\",
            \\\"sabnzbd_incomplete\\\": \\\"\$${MOUNT_STATUS[3]}\\\"
          }
        }\" > $$STATUS_FILE

        info 'All tasks complete. Starting status server on port 7891 ...'

        # ── Step 5: Serve status page ────────────────────────
        python3 - <<'PYEOF'
import http.server, json, os, signal, sys
from datetime import datetime

STATUS_FILE = '/home/umbrel/docker-init/status.json'

HTML = '''<!DOCTYPE html>
<html lang=\"en\">
<head>
<meta charset=\"UTF-8\">
<meta http-equiv=\"refresh\" content=\"30\">
<title>NAS Init — Status</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0f0f0f; color:#e0e0e0; margin:0; padding:2rem; }
  h1   { color:#fff; margin-bottom:0.25rem; }
  p    { color:#888; margin-top:0; }
  .card { background:#1a1a1a; border-radius:12px; padding:1.5rem; margin-bottom:1rem; }
  .row  { display:flex; justify-content:space-between; align-items:center; padding:0.5rem 0;
          border-bottom:1px solid #2a2a2a; }
  .row:last-child { border-bottom:none; }
  .label { color:#ccc; }
  .ok    { color:#4ade80; font-weight:600; }
  .error { color:#f87171; font-weight:600; }
  .ts    { font-size:0.8rem; color:#555; }
</style>
</head>
<body>
<h1>🖥️ NAS Init</h1>
<p>Auto-refreshes every 30 seconds</p>
{content}
</body></html>'''

def badge(val):
    return f'<span class=\"ok\">✓ OK</span>' if val == 'ok' else f'<span class=\"error\">✗ Error</span>'

class Handler(http.server.BaseHTTPRequestHandler):
    def log_message(self, *a): pass
    def do_GET(self):
        try:
            with open(STATUS_FILE) as f:
                data = json.load(f)
            rows = f'''
            <div class=\"card\">
              <div class=\"row\"><span class=\"label\">mc (Midnight Commander)</span>{badge(data.get(\"mc\",\"error\"))}</div>
            </div>
            <div class=\"card\">
              <div style=\"font-weight:600;margin-bottom:0.75rem;color:#fff\">NAS Mounts</div>
              <div class=\"row\"><span class=\"label\">qbittorrent / complete</span>{badge(data[\"mounts\"][\"qbittorrent_complete\"])}</div>
              <div class=\"row\"><span class=\"label\">qbittorrent / incomplete</span>{badge(data[\"mounts\"][\"qbittorrent_incomplete\"])}</div>
              <div class=\"row\"><span class=\"label\">sabnzbd / complete</span>{badge(data[\"mounts\"][\"sabnzbd_complete\"])}</div>
              <div class=\"row\"><span class=\"label\">sabnzbd / incomplete</span>{badge(data[\"mounts\"][\"sabnzbd_incomplete\"])}</div>
            </div>
            <p class=\"ts\">Last run: {data.get(\"timestamp\",\"unknown\")}</p>'''
        except Exception as e:
            rows = f'<div class=\"card\"><p class=\"error\">Could not read status: {e}</p></div>'
        body = HTML.replace('{content}', rows).encode()
        self.send_response(200)
        self.send_header('Content-Type','text/html; charset=utf-8')
        self.send_header('Content-Length', len(body))
        self.end_headers()
        self.wfile.write(body)

signal.signal(signal.SIGTERM, lambda *_: sys.exit(0))
http.server.HTTPServer(('0.0.0.0', 7891), Handler).serve_forever()
PYEOF
      "
