manifestVersion: 1
id: martinmeel-hermes
name: Hermes Agent
tagline: The self-improving AI agent that grows with you
icon: https://raw.githubusercontent.com/MartinMeel/umbrel-app-gallery/main/martinmeel-hermes/icon.svg
category: ai
version: "main-2026.05.24"
port: 9119
description: >-
  Hermes Agent is an open-source, provider-agnostic AI agent framework from
  Nous Research. It runs in your browser through the Hermes dashboard and can
  help with software development, research, system administration, data
  analysis, content creation, and other tasks that benefit from an AI agent
  with tools, persistent memory, and reusable skills.


  This Umbrel app installs the official Hermes Agent container and stores all
  configuration, sessions, skills, memory, and credentials in the app data
  directory on your Umbrel.


  After installing, open the app and use the dashboard setup flow to configure
  your preferred model provider or add API keys.
developer: Nous Research
