<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MartinMeel System Status</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="hero">
        <p class="eyebrow">UmbrelOS monitor</p>
        <h1>MartinMeel System Status</h1>
        <p class="lede">
          SMB mounts, host hook status, daily Gluetun automation, and every running container that routes through the VPN.
        </p>
        <p id="meta" class="meta">Loading live status…</p>
      </section>

      <section class="grid">
        <article class="panel">
          <h2>SMB Credentials</h2>
          <div id="credentials"></div>
        </article>

        <article class="panel">
          <h2>Scheduled Restart</h2>
          <div id="restart"></div>
        </article>
      </section>

      <section class="panel">
        <h2>Mounted Shares</h2>
        <div id="shares"></div>
      </section>

      <section class="grid">
        <article class="panel">
          <h2>Hooks and Timer</h2>
          <div id="hooks"></div>
        </article>

        <article class="panel">
          <h2>Gluetun</h2>
          <div id="gluetun"></div>
        </article>
      </section>

      <section class="panel">
        <h2>Dependent Containers</h2>
        <div id="containers"></div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
  </html>
