services:
#  app_proxy:
#    environment:
#      APP_HOST: martinmeel-system-status_server_1
#      APP_PORT: 3000

  server:
    image: node:20-alpine
    working_dir: /app
    command:
      - node
      - server.js
    volumes:
      - ./runtime:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /home/umbrel/umbrel/home:/host-home:ro
      - /home/umbrel/umbrel/custom-hooks:/host-hooks:ro
      - /etc/systemd/system:/host-systemd:ro
    environment:
      - APP_PORT=3000
    restart: unless-stopped
