category: multimedia
name: 2.6 Arr Dashboard
version: "12.11.0"
tagline: A unified dashboard for managing multiple Sonarr, Radarr, Prowlarr, Lidarr, Readarr, Plex, Tautulli, and Seerr instances.
icon: https://raw.githubusercontent.com/MartinMeel/umbrel-app-gallery/main/martinmeel-arr-dashboard/icon.png
port: 3443
description: >-
  A unified dashboard for managing multiple Sonarr, Radarr, Prowlarr, Lidarr, Readarr, Plex, Tautulli, and Seerr instances. Consolidate your media automation management into a single, secure, and powerful interface.
   
  🛠️ SETUP INSTRUCTIONS
  During initial set-up, you will need to input your Umbrel device's IP address to connect to Sonarr and/or Radarr. 
  You can find your device's IP address by visiting your router's admin dashboard or by using an IP scanning tool like Angry IP Scanner. 
  You will also need to input your API key for Sonarr and/or Radarr. You can find your API keys in the settings of the Sonarr and Radarr apps.

  ⚠️ This version routes all traffic through Gluetun VPN for privacy and security.

