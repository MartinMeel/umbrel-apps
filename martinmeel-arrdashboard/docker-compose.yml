services:
  app_proxy:  # The Umbrel App Proxy automatically protects an app by requiring the user to enter their Umbrel password (either when they login into the main Web UI or by visiting an app directly e.g.
    environment:
       APP_HOST: martinmeel-arrdashboard_web_1 # <web-container-dns-name>
       APP_PORT: 3443  # <web-container-port-number>
       # Use this if another app outside your umbrel device wants to connect via an API call
       # PROXY_AUTH_WHITELIST: /api/*
       # There could be cases where you wish to disable this authentication. That can be done by adding this env. var. 
       PROXY_AUTH_ADD: 'false'
       # Another example could be that the root of the web application (/) should be publicly accessible but the admin section be protected by Umbrel. This can be achieved by adding these env. vars. to the app_proxy Docker Compose service:
       # PROXY_AUTH_WHITELIST: "*"
       # PROXY_AUTH_BLACKLIST: "/admin/*"

  web: # Officially should be "app:" or "web:""
    image: khak1s/arr-dashboard:2.16.1@sha256:52216515e3c137dbf81b6a86f7e5b7fbc43fbafe73c44f55e64680fd2e3716ac
    environment:
      - PUID=1000  # Set to your user ID (run `id -u` on host)
      - PGID=1000  # Set to your group ID (run `id -g` on host)
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
    # ports:
      # You do not need to expose the port that your app's web server is listening on if you're using the app_proxy service.
      # This is handled by the APP_HOST and APP_PORT environment variables in the service above.
      #
      # If you need to expose additional ports, you can do so like this, replacing <port> with the port number:
      #- 3443:3003
    restart: unless-stopped
    stop_grace_period: 1m
    