# Reference config only. docker-compose.yml currently uses the config bundled
# inside the gtstef/filebrowser image to avoid Umbrel legacy relative-bind issues.
server:
  port: 80
  baseURL: "/"
  logging:
    - levels: "info|warning|error"
  sources:
    - name: "Umbrel"
      path: "/srv"

auth:
  methods:
    password:
      enabled: true
      minLength: 5
      signup: false

userDefaults:
  ui:
    darkMode: true
  sidebar:
    sticky: true
  listing:
    showHidden: false
    quickDownload: false
    viewMode: "normal"
  account:
    permissions:
      api: true
      admin: true
      modify: true
      share: true
      realtime: true
      delete: true
      create: true
      download: true
    disableUpdateNotifications: true
