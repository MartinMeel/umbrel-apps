server:
  port: 80
  baseURL: "/"
  logging:
    - levels: "info|warning|error"
  sources:
    - path: "/srv"
      name: "Umbrel"
    - path: "/home/users"
      name: "My Files"
      config:
        defaultEnabled: true
        defaultUserScope: "/subfolder"
        createUserDir: true
        useLogicalSize: false
auth:
  methods:
    password:
      enabled: true
      minLength: 5
      signup: false

userDefaults:
  disableUpdateNotifications: false
  darkMode: false
  stickySidebar: true
  viewMode: normal
  permissions:
    admin: false
    modify: true
    share: true
    delete: true
    create: true
    download: true
