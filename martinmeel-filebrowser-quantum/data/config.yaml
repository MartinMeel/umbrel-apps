# Reference config only. docker-compose.yml currently uses the config bundled
# inside the gtstef/filebrowser image to avoid Umbrel legacy relative-bind issues.
server:
  port: 80
  baseURL: "/"
  logging:
    - levels: "info|warning|error"
  sources:
    - name: "Umbrel"
      path: "/srv"

auth:
  methods:
    password:
      enabled: true
      minLength: 5
      signup: false

userDefaults:
  disableUpdateNotifications: false
  darkMode: false
  hideHiddenFiles: true 
  stickySidebar: true
  viewMode: normal
  permissions:
    admin: false
    modify: true
    share: true
    delete: true
    create: true
    download: true