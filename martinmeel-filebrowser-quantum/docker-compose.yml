version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: martinmeel-filebrowser-quantum_server_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "true"

  server:
    image: gtstef/filebrowser:stable
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      TZ: Europe/Amsterdam
      # Use the config bundled inside the image. Do not bind-mount ./config.yaml:
      # Umbrel legacy compose resolves relative paths against its legacy-compat folder.
      # FILEBROWSER_CONFIG: "/home/filebrowser/config.yaml"
      # FILEBROWSER_DATABASE: "/home/filebrowser/data/database.db"
    volumes:
      - ${APP_DATA_DIR}/data:/home/filebrowser/data
      - ${APP_DATA_DIR}/files:/srv/app-files
      # - ${APP_DATA_DIR}/data/config.yaml:/home/filebrowser/data/config.yaml
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
