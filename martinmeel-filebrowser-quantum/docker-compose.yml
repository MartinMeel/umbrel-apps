version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: martinmeel-filebrowser-quantum_server_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "true"

  server:
    image: gtstef/filebrowser:stable
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    environment:
      FILEBROWSER_DATABASE: /home/filebrowser/data/database.db
      FILEBROWSER_CONFIG: /home/filebrowser/data/config.yaml
      TZ: Europe/Amsterdam
    volumes:
      - ${APP_DATA_DIR}/data:/home/filebrowser/data
      - ${APP_DATA_DIR}/files:/srv/app-files
      - ${UMBREL_ROOT}/home:/srv/umbrel-home
    command: ["--config", "/home/filebrowser/data/config.yaml", "--database", "/home/filebrowser/data/database.db"]
