services:
  server:
    image: node:20-alpine
    working_dir: /app
    command:
      - node
      - server.js
    volumes:
      - ${APP_DATA_DIR}/server.js:/app/server.js:ro
      - ${APP_DATA_DIR}/static:/app/static:ro
      - ${UMBREL_ROOT}/app-data:/host-app-data
      - ${UMBREL_ROOT}/custom-hooks:/host-custom-hooks
      - /etc/systemd/system:/host-systemd:ro
    environment:
      - APP_PORT=3000
    restart: unless-stopped
    container_name: martinmeel-hook-manager_server_1

  app_proxy:
    environment:
      APP_HOST: martinmeel-hook-manager_server_1
      APP_PORT: 3000
